# File di PRODUZIONE: usato direttamente da Portainer/Coolify quando
# collegano questo repository. Costruisce le immagini ottimizzate (stage
# "production" dei Dockerfile: backend compilato, frontend servito da
# Nginx come static build) e non monta il codice sorgente nei container.
#
# In locale, "docker compose up" carica automaticamente anche
# docker-compose.override.yml (hot reload, bind mount del codice, porte
# dirette su localhost) senza bisogno di alcuna opzione aggiuntiva: la
# UX di sviluppo descritta nel README resta invariata.
#
# Nessun reverse proxy proprio: il traffico arriva già instradato dal
# proxy della piattaforma (Traefik su Coolify, Traefik/Nginx Proxy
# Manager su Portainer) verso il servizio "frontend" (porta 80), che fa
# da unico punto d'ingresso e proxa "/api" e "/uploads" al backend.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-barmanager}
    volumes:
      # Rinominato da "postgres_data" apposta: i deploy falliti prima del
      # fix di DATABASE_URL avevano già inizializzato quel volume con
      # credenziali diverse (Postgres le applica solo alla primissima
      # creazione, mai più dopo), causando "P1000: Authentication
      # failed" ad ogni avvio anche a variabili corrette. Un nome nuovo
      # forza Compose a creare un volume vuoto invece di riusare quello
      # vecchio — via preferibile a toccare i volumi dalla UI di
      # Coolify, che li tiene in sola lettura lì.
      - postgres_data_v2:/var/lib/postgresql/data
    # -d esplicito: senza, pg_isready si connette di default a un
    # database con lo stesso nome dello username (-U), non a quello di
    # POSTGRES_DB. Se sono due valori diversi l'healthcheck fallisce in
    # loop con "database <utente> does not exist" anche a inizializzazione
    # riuscita, e "postgres" non risulta mai sano (backend/frontend
    # restano bloccati in attesa).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barmanager} -d ${POSTGRES_DB:-barmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      # Costruita dalle stesse variabili POSTGRES_* del servizio "postgres"
      # qui sopra (unica fonte di verità per la password): un DATABASE_URL
      # impostato a mano, disallineato da POSTGRES_PASSWORD, è la causa più
      # comune di "P1000: Authentication failed" — soprattutto dopo un
      # redeploy, perché Postgres applica POSTGRES_USER/PASSWORD solo alla
      # primissima creazione del volume dati, non ad ogni avvio.
      DATABASE_URL: postgresql://${POSTGRES_USER:-barmanager}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-barmanager}
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    # "prisma db push" applica lo schema corrente al database ad ogni
    # avvio/deploy. Va bene per questa fase del progetto; prima di andare
    # live con dati reali conviene passare a migrazioni versionate
    # ("prisma migrate deploy", vedi docs/DEVELOPMENT.md §10).
    command: sh -c "npx prisma db push && node dist/main"
    # GET /api/health verifica anche la connessione al database (§health
    # in backend/src/health): se Postgres diventa irraggiungibile dopo
    # l'avvio, il container viene segnalato "unhealthy". Node invece di
    # wget: elimina il dubbio sulla presenza/comportamento di wget in
    # questa variante Alpine, e 127.0.0.1 esplicito combacia col bind
    # 0.0.0.0 impostato in main.ts (niente ambiguità IPv6/dual-stack su
    # "localhost").
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # "default" per parlare con backend (risoluzione DNS interna di
    # Compose); "coolify" perché Traefik vive lì (vedi il compose di
    # coolify-proxy: "networks: coolify: external: true") — senza
    # condividerla, scopre le label via socket Docker ma non ha una rete
    # per raggiungere davvero il container: da qui "no available server"
    # anche a router configurato correttamente.
    networks:
      - default
      - coolify

    # Routing wildcard (*.${ROOT_DOMAIN}) via label Traefik, per i casi in
    # cui il dominio wildcard non si possa impostare dal dialog "Add
    # Domain" della UI (accetta solo un FQDN singolo, non "*.dominio").
    # Con queste label NON aggiungere anche un dominio dalla UI per lo
    # stesso servizio: creerebbe due router in conflitto.
    #
    # Sintassi HostRegexp di Traefik v3 (regex diretta, non più i
    # placeholder "{nome:pattern}" di v2) — verificato contro il compose
    # di coolify-proxy: immagine traefik:v3.6, entrypoint HTTPS "https",
    # certresolver "letsencrypt" con DNS-01 su OVH già configurato.
    #
    # tls.domains esplicito: con una regola HostRegexp (nessun hostname
    # fisso) Traefik non può dedurre da solo per quale dominio richiedere
    # il certificato, quindi senza questa coppia di label non ne
    # richiede nessuno e il browser vede il certificato di default (da
    # cui l'errore SSL).
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - 'traefik.http.routers.barmanager.rule=HostRegexp(`^[a-z0-9-]+\.${ROOT_DOMAIN}$`)'
      - traefik.http.routers.barmanager.entrypoints=https
      - traefik.http.routers.barmanager.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.barmanager.tls.domains[0].main=${ROOT_DOMAIN}
      - traefik.http.routers.barmanager.tls.domains[0].sans=*.${ROOT_DOMAIN}
      - traefik.http.services.barmanager.loadbalancer.server.port=80

networks:
  # Creata e gestita da coolify-proxy, non da questo stack: deve già
  # esistere sul server (external: true), non viene creata qui.
  coolify:
    external: true

volumes:
  postgres_data_v2:
  redis_data:
  uploads_data:
