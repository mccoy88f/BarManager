name: Mobile release

# Compila e rilascia BarManager (Android APK + iOS build) e BarManager Kiosk.
# Si attiva al push su main o con workflow_dispatch.
#
# Calcola la versione AAAA.MM.GG-N, la inietta in web/Android/iOS, pubblica
# gli APK (e l'IPA se la firma iOS è configurata) sulla stessa GitHub Release,
# poi committa version.ts su main per allineare il sito.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Note di rilascio (facoltative)'
        required: false
        default: ''
  push:
    branches:
      - main

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accetta le licenze SDK Android e installa i pacchetti richiesti
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0" || true

      - name: Calcola la versione univoca (AAAA.MM.GG-N)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y.%m.%d)
          N=1
          while gh release view "${DATE}-${N}" >/dev/null 2>&1; do
            N=$((N + 1))
          done
          VERSION="${DATE}-${N}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versione calcolata: ${VERSION}"

      - name: Inietta la versione nei progetti Android, iOS e web
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE=$(echo "${VERSION}" | awk -F'[-.]' '{printf "%02d%02d%02d%02d", $1%100, $2, $3, $4}')
          echo "Versione: ${VERSION}, versionCode: ${VERSION_CODE}"
          sed -i "s/export const APP_VERSION = '.*';/export const APP_VERSION = '${VERSION}';/" frontend/src/version.ts
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" frontend/android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" frontend/android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" kiosk-android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" kiosk-android/app/build.gradle
          # iOS (Xcode): MARKETING_VERSION = short version, CURRENT_PROJECT_VERSION = build
          sed -i "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = ${VERSION}/" frontend/ios/App/App.xcodeproj/project.pbxproj
          if grep -q 'CURRENT_PROJECT_VERSION' frontend/ios/App/App.xcodeproj/project.pbxproj; then
            sed -i "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = ${VERSION_CODE}/" frontend/ios/App/App.xcodeproj/project.pbxproj
          else
            sed -i "s/MARKETING_VERSION = ${VERSION};/MARKETING_VERSION = ${VERSION};\n\t\t\t\tCURRENT_PROJECT_VERSION = ${VERSION_CODE};/" frontend/ios/App/App.xcodeproj/project.pbxproj
          fi

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sincronizza Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build APK BarManager (gestionale)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build APK BarManager Kiosk (schermi promo)
        working-directory: kiosk-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina gli APK con la versione
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "BarManager-${VERSION}.apk"
          cp kiosk-android/app/build/outputs/apk/debug/app-debug.apk "BarManager-Kiosk-${VERSION}.apk"

      - name: Pubblica la GitHub Release con gli APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes || github.event.head_commit.message || 'Release BarManager (Android/iOS) e BarManager Kiosk' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${VERSION}" \
            "BarManager-${VERSION}.apk" \
            "BarManager-Kiosk-${VERSION}.apk" \
            --title "BarManager ${VERSION}" \
            --notes "${RELEASE_NOTES}"

      - name: Allinea la versione sul repository (sito = app)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/version.ts \
            frontend/android/app/build.gradle \
            kiosk-android/app/build.gradle \
            frontend/ios/App/App.xcodeproj/project.pbxproj
          if git diff --staged --quiet; then
            echo "Versione già allineata a ${VERSION}, nessun commit."
          else
            git commit -m "chore: allinea versione piattaforma a ${VERSION}"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Versione ${VERSION} committata su main per il deploy web."
          fi

  build-ios:
    needs: build-and-release
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend e sync Capacitor iOS
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Inietta la versione iOS
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          VERSION_CODE=$(echo "${VERSION}" | awk -F'[-.]' '{printf "%02d%02d%02d%02d", $1%100, $2, $3, $4}')
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = ${VERSION}/" frontend/ios/App/App.xcodeproj/project.pbxproj
          if grep -q 'CURRENT_PROJECT_VERSION' frontend/ios/App/App.xcodeproj/project.pbxproj; then
            sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = ${VERSION_CODE}/" frontend/ios/App/App.xcodeproj/project.pbxproj
          fi

      - name: Compila iOS (simulatore, verifica codice)
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -scheme App \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Allega nota iOS alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build-and-release.outputs.version }}"
          cat > ios-notes.txt << EOF
          Progetto iOS Capacitor incluso in questo tag (frontend/ios).
          Build simulatore verificata in CI.
          Per installare su iPhone: apri frontend/ios/App/App.xcodeproj in Xcode,
          seleziona il team di firma Apple e fai Archive / Distribute.
          EOF
          # Non fallisce se la release non accetta note file: solo log
          echo "iOS OK per ${VERSION}"
