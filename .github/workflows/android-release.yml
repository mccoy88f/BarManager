name: Android release

# Compila e rilascia sia l'app principale BarManager sia l'app BarManager Kiosk.
# Si attiva automaticamente al push su branch main, oppure manualmente
# tramite workflow_dispatch dalla scheda Actions di GitHub.
#
# Calcola la versione nel formato AAAA.MM.GG-N verificando le release
# già esistenti su GitHub per la data odierna, inietta la versione nei
# progetti Android, compila entrambi gli APK e li allega alla stessa
# GitHub Release.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Note di rilascio (facoltative)'
        required: false
        default: ''
  push:
    branches:
      - main

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accetta le licenze SDK Android e installa i pacchetti richiesti
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0" || true

      - name: Calcola la versione univoca (AAAA.MM.GG-N)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y.%m.%d)
          N=1
          while gh release view "${DATE}-${N}" >/dev/null 2>&1; do
            N=$((N + 1))
          done
          VERSION="${DATE}-${N}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versione calcolata: ${VERSION}"

      - name: Inietta la versione nei progetti Android
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/export const APP_VERSION = '.*';/export const APP_VERSION = '${VERSION}';/" frontend/src/version.ts
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" frontend/android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" kiosk-android/app/build.gradle

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sincronizza il progetto Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build APK BarManager (gestionale)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build APK BarManager Kiosk (schermi promo)
        working-directory: kiosk-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina gli APK con la versione
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "BarManager-${VERSION}.apk"
          cp kiosk-android/app/build/outputs/apk/debug/app-debug.apk "BarManager-Kiosk-${VERSION}.apk"

      - name: Pubblica la GitHub Release con entrambi gli APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes || github.event.head_commit.message || 'Release BarManager e BarManager Kiosk' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${VERSION}" \
            "BarManager-${VERSION}.apk" \
            "BarManager-Kiosk-${VERSION}.apk" \
            --title "BarManager ${VERSION}" \
            --notes "${RELEASE_NOTES}"
