// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Plugin Kotlin: MainActivity/DomainSetupActivity/il plugin di stampa ESC/POS
        // (§5.11 di docs/DEVELOPMENT.md) sono scritti in Kotlin, non Java.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // JitPack: distribuisce DantSu/ESCPOS-ThermalPrinter-Android (§5.11
        // di docs/DEVELOPMENT.md), non pubblicata su Maven Central.
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
