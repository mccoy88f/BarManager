server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Senza questo, il default di nginx (1MB) blocca con 413 già gli upload
    # foto esistenti (5MB) e a maggior ragione i video di Display Promo
    # (fino a 100MB lato backend, v. display-promo.controller.ts).
    client_max_body_size 110M;

    # Proxy trasparente verso il backend: frontend e API restano sullo
    # stesso sotto-dominio (nessun CORS, nessuna configurazione per-locale
    # lato client). "backend" è il nome del servizio Docker Compose.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload (foto, documenti e video fino a 100MB), serviti staticamente dal backend.
    # HTTP/1.1, inoltro dei Range headers e proxy_buffering disattivato sono
    # necessari per consentire lo streaming video HTML5 con richieste 206
    # (Partial Content) su Chrome, Safari e WebView Android.
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Il worker di pdf.js (.mjs) va caricato dal browser come module worker,
    # che richiede un Content-Type JS corretto: il mime.types di default di
    # nginx non mappa .mjs e lo servirebbe come application/octet-stream,
    # facendo fallire il caricamento del worker (anteprima PDF vuota).
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # index.html mai in cache: altrimenti dopo un redeploy il browser tiene
    # la shell vecchia e il menu laterale continua a mostrare la versione
    # precedente anche se gli asset hashati nuovi sono già sul server.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback per il routing client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker/manifest: mai in cache aggressiva
    location ~* \.(?:sw\.js|webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
