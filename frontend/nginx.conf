server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback per il routing client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker/manifest: mai in cache aggressiva
    location ~* \.(?:sw\.js|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
}
